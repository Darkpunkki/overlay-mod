<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OverlayMod</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- Starts without is-healthy, so the status line shows until data arrives. -->
  <div id="overlay" class="overlay">
    <header class="run">
      <div class="run__timer" id="runTimer">0:00.000</div>
      <div class="run__meta">
        <!-- The route name used to sit here. It is chosen once and never
             changes mid-run, so on screen it was a label nobody read. -->
        <span class="run__profile" id="profileName"></span>
        <span class="run__meta-right">
          <!-- How many attempts this route has seen under this challenge.
               Hidden when switched off in the appearance settings. -->
          <span class="run__attempts" id="attempts" hidden></span>
          <!-- The whole-run best. Shown for challenges with no totals footer,
               which would otherwise repeat the timer directly above it. -->
          <span class="run__pb" id="runPb" hidden></span>
        </span>
      </div>
    </header>

    <ol class="splits" id="splits"></ol>

    <footer class="totals" id="totals">
      <div class="total total--primary">
        <span class="total__label" id="primaryLabel">Damage</span>
        <span class="total__value" id="primaryValue">0</span>
        <span class="total__pb" id="primaryPb"></span>
      </div>
    </footer>

    <div class="status" id="status">connecting&hellip;</div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
